<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生物適應小偵探</title>
  <style>
    :root {
      --bg: #f3f9f4;
      --card: #ffffff;
      --green: #4b9c66;
      --blue: #5da8d8;
      --beige: #f5ecd9;
      --orange: #f2b47e;
      --brown: #9b7b5f;
      --text: #2e3b2f;
      --muted: #5f6d60;
      --shadow: 0 10px 24px rgba(47, 78, 60, 0.12);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at 20% 15%, #ffffff 0%, #eef8f1 45%, #e3f0ef 100%);
      color: var(--text);
      min-height: 100vh;
      font-size: 18px;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 16px;
      animation: fadeIn .35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2, h3 { margin: .2em 0 .4em; line-height: 1.3; }
    h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); }
    h2 { font-size: clamp(1.35rem, 4vw, 1.8rem); }
    p { margin: .45em 0; line-height: 1.6; }

    .subtitle { color: var(--muted); font-size: 1.05rem; }
    .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .emoji-big { font-size: 2.2rem; }

    .btn-row, .choice-grid { display: grid; gap: 12px; }
    .btn-row { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

    button {
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #6db685, #4b9c66);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 14px 14px;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, opacity .2s;
      min-height: 56px;
    }

    button:hover, button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 8px 14px rgba(51, 109, 73, 0.25);
      outline: none;
    }

    button.secondary { background: linear-gradient(135deg, #7cb8d8, #5da8d8); }
    button.soft { background: linear-gradient(135deg, #f7c99d, #f0ae70); color: #55351f; }
    button.ghost {
      background: #f5f7f6;
      color: var(--text);
      border: 2px solid #dce8df;
    }

    .choice-btn {
      text-align: left;
      background: #f8fbf9;
      color: #2f4232;
      border: 2px solid #dceadf;
    }

    .choice-btn.selected { border-color: var(--blue); background: #eaf6fd; }
    .choice-btn.correct { border-color: #4ba964; background: #e8f8eb; }
    .choice-btn.wrong { border-color: #d26b68; background: #fdeeed; }

    .choice-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 12px;
      background: #eef6f0;
      border: 1px solid #d7e7dc;
      font-weight: 700;
      margin: 4px 6px 4px 0;
      font-size: .95rem;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 0;
    }

    .animal-show {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      background: linear-gradient(135deg, #fbfffc, #f1f9f5);
      border-radius: 14px;
      border: 1px solid #e0efe5;
    }

    .animal-icon { font-size: clamp(2rem, 8vw, 4rem); }

    .step-title {
      font-size: 1.18rem;
      color: #234f33;
      margin-top: 6px;
      font-weight: 800;
    }

    .feedback {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid transparent;
      font-weight: 600;
      line-height: 1.6;
    }

    .feedback.correct { background: #ebf9ef; border-color: #90d3a0; }
    .feedback.wrong { background: #fff1f0; border-color: #f0b3af; }

    .map-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    }

    .zone-card {
      border-radius: 14px;
      border: 2px solid #dceadf;
      padding: 12px;
      background: #fbfffc;
    }

    .zone-card.done { border-color: #ffcc5c; background: #fff7df; }

    .stars {
      font-size: 1.15rem;
      letter-spacing: 2px;
      min-height: 1.5em;
    }

    .star-pop { animation: pop .5s ease; display: inline-block; }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35) rotate(-8deg); }
      100% { transform: scale(1); }
    }

    .badge-pop {
      animation: badge .7s ease;
      background: #fff6df;
      border: 2px solid #ffcf6a;
      border-radius: 12px;
      padding: 10px;
      margin-top: 12px;
      font-weight: 800;
    }

    @keyframes badge {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .footer-note { text-align: center; color: #5d6c61; font-size: .96rem; }

    @media (max-width: 700px) {
      body { font-size: 19px; }
      .app { padding: 12px; }
      .card { padding: 14px; }
      button { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

        traitChoices: ["堅硬嘴巴", "長舌頭", "強壯爪子", "寬大腳掌", "厚脂肪"],

      {
        id: 9,
        zone: "寒冷地區與特殊環境",
        name: "企鵝",
        habitat: ["寒冷海邊"],

      {

        habitatChoices: ["草原", "水中", "寒冷地區", "沙漠", "森林"],
        traits: ["長脖子", "長腿"],
        traitChoices: ["長脖子", "長腿", "厚毛", "鰓", "腳蹼"],
        functions: ["幫助吃高處的葉子", "幫助看得更遠"],
        functionChoices: ["幫助吃高處的葉子", "幫助看得更遠", "幫助游泳", "幫助防風沙", "幫助儲水"],
        summary: "長頸鹿住在草原，長脖子可吃高葉，長腿也讓牠看得更遠。",
        emoji: "🦒",
        description: "高高的身體讓牠在草原很顯眼。"
      },

        id: 11,
        zone: "水中與水邊",
        name: "螃蟹",
        habitat: ["海邊 / 沙灘"],
        habitatChoices: ["海邊 / 沙灘", "森林", "寒冷地區", "沙漠", "草原"],
        traits: ["硬殼", "大螯"],
        traitChoices: ["硬殼", "大螯", "厚毛", "長舌頭", "鰓"],
        functions: ["幫助保護身體", "幫助夾食物"],
        functionChoices: ["幫助保護身體", "幫助夾食物", "幫助保暖", "幫助在水中呼吸", "幫助抓住樹幹"],
        summary: "螃蟹在海邊或沙灘，硬殼能保護身體，大螯可夾食物。",
        emoji: "🦀",
        description: "會橫著走路，是海邊常見的小動物。"
      },
      {
        id: 12,
        zone: "寒冷地區與特殊環境",
        name: "河馬",
        habitat: ["河邊 / 水邊"],
        habitatChoices: ["河邊 / 水邊", "沙漠", "寒冷地區", "高山", "海底"],
        traits: ["眼睛和鼻孔在頭頂"],
        traitChoices: ["眼睛和鼻孔在頭頂", "長睫毛", "厚毛", "葉子變刺", "鰭"],
        functions: ["幫助泡在水裡時仍能呼吸和觀察"],
        functionChoices: ["幫助泡在水裡時仍能呼吸和觀察", "幫助防風沙", "幫助游泳", "幫助抓昆蟲", "幫助啄樹"],
        summary: "河馬常在河邊，眼睛與鼻孔位置讓牠泡水時仍能觀察與呼吸。",
        emoji: "🦛",
        description: "身體大、愛泡水，頭部構造很有特色。"
      }
    ];

    const zones = [
      { name: "水中與水邊", badge: "水邊觀察員", icon: "💧" },
      { name: "森林與山區", badge: "森林調查員", icon: "🌳" },
      { name: "沙漠與乾燥地區", badge: "沙漠發現家", icon: "🏜️" },
      { name: "寒冷地區與特殊環境", badge: "極地探索員", icon: "❄️" }
    ];

    // 固定關卡順序，讓學生更容易追蹤進度
    const levelOrder = [2, 3, 5, 11, 1, 8, 10, 4, 7, 6, 9, 12]
      .map(id => questions.find(q => q.id === id));

    const STORAGE_KEY = "bio_detective_save_v1";

    const defaultState = {
      page: "home", // home | guide | map | level | zoneDone | final
      levelIndex: 0,
      step: 1,
      selected: [],
      answered: false,
      feedback: null,
      completedIds: [],
      stars: 0,
      badges: [],
      lastZoneBadge: "",
      showStarPop: false
    };

    let state = loadState();
    const app = document.getElementById("app");

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultState);
        return { ...structuredClone(defaultState), ...JSON.parse(raw) };
      } catch {
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function resetRun() {
      state = structuredClone(defaultState);
      saveState();
      render();
    }

    function getCurrentQuestion() {
      return levelOrder[state.levelIndex];
    }

    function getStepConfig(question) {
      const map = {
        1: {
          title: "第一步：這個生物住在哪裡？",
          multi: false,
          choices: question.habitatChoices,
          answers: question.habitat,
          explain: "生物的棲地會和牠平常活動方式有關。"
        },
        2: {
          title: "第二步：這個生物有什麼適應特徵？",
          multi: true,
          choices: question.traitChoices,
          answers: question.traits,
          explain: "外型與身體構造，都是為了更容易生存。"
        },
        3: {
          title: "第三步：這些特徵有什麼用？",
          multi: true,
          choices: question.functionChoices,
          answers: question.functions,
          explain: "每個特徵都有用途，能幫助牠在環境中生活。"
        }
      };
      return map[state.step];
    }

    function arraysEqualAsSet(a, b) {
      if (a.length !== b.length) return false;
      const sa = new Set(a);
      return b.every(x => sa.has(x));
    }

    function toggleSelect(choice, multi) {
      if (state.answered) return;
      if (multi) {
        if (state.selected.includes(choice)) {
          state.selected = state.selected.filter(c => c !== choice);
        } else {
          state.selected = [...state.selected, choice];
        }
      } else {
        state.selected = [choice];
      }
      render();
    }

    function submitStep() {
      const q = getCurrentQuestion();
      const cfg = getStepConfig(q);
      if (!state.selected.length) {
        state.feedback = {
          ok: false,
          text: "先選一個答案喔，我們一步一步來。",
          answerText: cfg.answers.join("、")
        };
        state.answered = true;
        render();
        return;
      }

      const ok = arraysEqualAsSet(state.selected, cfg.answers);
      const rightText = cfg.answers.join("、");
      const intro = ok ? "答對了！" : "再想想看，沒關係，我們一起修正。";
      const custom = state.step === 1
        ? `${q.name}的棲地是「${rightText}」。`
        : state.step === 2
          ? `${q.name}的重要特徵有：${rightText}。`
          : `${q.name}這些特徵的功能是：${rightText}。`;

      state.feedback = {
        ok,
        text: `${intro}${custom} ${cfg.explain}`,
        answerText: rightText
      };
      state.answered = true;

      if (ok && state.step === 3) {
        state.showStarPop = true;
      }

      render();
    }

    function nextAction() {
      const q = getCurrentQuestion();
      if (state.step < 3) {
        state.step += 1;
        state.selected = [];
        state.answered = false;
        state.feedback = null;
        render();
        return;
      }

      // 完成關卡
      if (!state.completedIds.includes(q.id)) {
        state.completedIds.push(q.id);
        state.stars += 1;
      }

      // 判斷是否完成區域
      const zoneQuestions = levelOrder.filter(item => item.zone === q.zone).map(item => item.id);
      const zoneDone = zoneQuestions.every(id => state.completedIds.includes(id));
      if (zoneDone) {
        const zoneInfo = zones.find(z => z.name === q.zone);
        if (zoneInfo && !state.badges.includes(zoneInfo.badge)) {
          state.badges.push(zoneInfo.badge);
          state.lastZoneBadge = zoneInfo.badge;
          state.page = "zoneDone";
        }
      }

      if (state.page !== "zoneDone") {
        if (state.levelIndex < levelOrder.length - 1) {
          state.levelIndex += 1;
          state.step = 1;
          state.selected = [];
          state.answered = false;
          state.feedback = null;
          state.showStarPop = false;
          state.page = "map";
        } else {
          state.page = "final";
        }
      }
      saveState();
      render();
    }

    function goToLevel() {
      state.page = "level";
      state.step = 1;
      state.selected = [];
      state.answered = false;
      state.feedback = null;
      state.showStarPop = false;
      saveState();
      render();
    }

    function renderHome() {
      app.innerHTML = `
        <section class="card">
          <div class="title-row">
            <span class="emoji-big">🔎</span>
            <div>
              <h1>生物適應小偵探</h1>
              <p class="subtitle">找出牠住哪裡，為什麼長這樣！</p>
            </div>
          </div>
          <p>歡迎你，小偵探！一起觀察生物的棲地、特徵與功能，解開自然界的線索。</p>
          <div class="status">
            <span class="pill">⭐ 星星：${state.stars}</span>
            <span class="pill">🏅 徽章：${state.badges.length}</span>
            <span class="pill">📍 進度：${Math.min(state.levelIndex + 1, 12)} / 12</span>
          </div>
        </section>

        <section class="card">
          <div class="btn-row">
            <button onclick="startGame()">開始遊戲</button>
            <button class="secondary" onclick="showGuide()">遊戲說明</button>
            <button class="ghost" onclick="resetAllProgress()">重新開始（清除進度）</button>
          </div>
        </section>

        <p class="footer-note">🌿 生物不是隨便長成那樣，而是為了適應生活環境。</p>
      `;
    }

    function renderGuide() {
      app.innerHTML = `
        <section class="card">
          <h2>🧭 遊戲說明</h2>
          <p>你是一位<strong>生物小偵探</strong>。</p>
          <p>你要根據線索，依序完成三個小任務：</p>
          <p>1. 找出生物住在哪裡（棲地）</p>
          <p>2. 找出牠有哪些特徵</p>
          <p>3. 找出這些特徵有什麼用</p>
          <p>每完成一關可得 1 顆星，完成每個場景可得到徽章！</p>
          <p>完成全部關卡，你就能成為<strong>超級生物偵探</strong>！</p>
        </section>
        <section class="card">
          <div class="btn-row">
            <button onclick="startGame()">我準備好了！開始</button>
            <button class="ghost" onclick="goHome()">回首頁</button>
          </div>
        </section>
      `;
    }

    function renderMap() {
      const nextQ = getCurrentQuestion();
      const zoneHtml = zones.map(z => {
        const zoneIds = levelOrder.filter(q => q.zone === z.name).map(q => q.id);
        const doneCount = zoneIds.filter(id => state.completedIds.includes(id)).length;
        const isDone = doneCount === zoneIds.length;
        return `
          <div class="zone-card ${isDone ? "done" : ""}">
            <h3>${z.icon} ${z.name}</h3>
            <p>完成：${doneCount} / ${zoneIds.length}</p>
            <p>${isDone ? "已獲得徽章：🏅" + z.badge : "繼續努力，快完成本區！"}</p>
          </div>
        `;
      }).join("");

      app.innerHTML = `
        <section class="card">
          <h2>🗺️ 偵探闖關地圖</h2>
          <p>下一關：<strong>${nextQ.name}</strong>（${nextQ.zone}）</p>
          <div class="status">
            <span class="pill">⭐ 星星：${state.stars}</span>
            <span class="pill">🏅 徽章：${state.badges.length}</span>
            <span class="pill">📍 第 ${state.levelIndex + 1} 關 / 共 12 關</span>
          </div>
        </section>
        <section class="card">
          <div class="map-grid">${zoneHtml}</div>
        </section>
        <section class="card">
          <div class="btn-row">
            <button onclick="goToLevel()">進入下一關</button>
            <button class="secondary" onclick="quickPractice()">快速練習（隨機一題）</button>
            <button class="ghost" onclick="goHome()">回首頁</button>
          </div>
        </section>
      `;
    }

    function renderLevel() {
      const q = getCurrentQuestion();
      const cfg = getStepConfig(q);

      const choices = cfg.choices.map(c => {
        const selected = state.selected.includes(c);
        let klass = "choice-btn";
        if (state.answered) {
          if (cfg.answers.includes(c)) klass += " correct";
          else if (selected) klass += " wrong";
        } else if (selected) klass += " selected";

        return `<button class="${klass}" onclick="toggleChoice('${c.replace(/'/g, "\\'")}', ${cfg.multi})">${selected ? "✅ " : "⬜ "}${c}</button>`;
      }).join("");

      app.innerHTML = `
        <section class="card">
          <div class="status">
            <span class="pill">場景：${q.zone}</span>
            <span class="pill">關卡：第 ${state.levelIndex + 1} 關 / 共 12 關</span>
            <span class="pill">⭐ ${state.stars}</span>
          </div>
          <div class="animal-show">
            <div>
              <h2>${q.name}</h2>
              <p>${q.description}</p>
            </div>
            <div class="animal-icon">${q.emoji || "🐾"}</div>
          </div>

          <p class="step-title">${cfg.title}</p>
          <p class="subtitle">${cfg.multi ? "本題可複選，請選出全部正確答案。" : "本題單選，選 1 個最適合的答案。"}</p>
          <div class="choice-grid">${choices}</div>

          ${state.feedback ? `
            <div class="feedback ${state.feedback.ok ? "correct" : "wrong"}">
              ${state.feedback.text}<br>
              正確答案：${state.feedback.answerText}
            </div>` : ""}

          ${state.answered && state.step === 3 ? `
            <div class="feedback correct">
              🧩 本關總結：${q.summary}
            </div>` : ""}
        </section>

        <section class="card">
          <div class="btn-row">
            ${!state.answered
              ? `<button onclick="submitStep()">送出答案</button>`
              : `<button class="soft" onclick="nextAction()">${state.step < 3 ? "下一步" : "下一關"}</button>`
            }
            <button class="ghost" onclick="state.page='map'; saveState(); render();">回地圖</button>
          </div>
        </section>
      `;
    }

    function renderZoneDone() {
      app.innerHTML = `
        <section class="card">
          <h2>🎉 場景完成！</h2>
          <p>你完成了一個場景，觀察力越來越強了！</p>
          <div class="badge-pop">🏅 你獲得徽章：${state.lastZoneBadge}</div>
          <div class="stars">${state.showStarPop ? '<span class="star-pop">⭐</span>' : '⭐'} 已收集 ${state.stars} 顆星</div>
        </section>
        <section class="card">
          <div class="btn-row">
            <button onclick="continueAfterBadge()">繼續挑戰</button>
            <button class="ghost" onclick="goHome()">回首頁</button>
          </div>
        </section>
      `;
    }

    function renderFinal() {
      const title = state.stars >= 12 ? "超級生物偵探" : state.stars >= 8 ? "生物觀察員" : "生物小幫手";
      const badgeList = state.badges.length ? state.badges.join("、") : "尚未獲得";

      app.innerHTML = `
        <section class="card">
          <h1>🏆 任務完成！</h1>
          <p class="subtitle">你已完成全部 12 關，太棒了！</p>
          <div class="status">
            <span class="pill">✅ 完成關卡：${state.completedIds.length} / 12</span>
            <span class="pill">⭐ 總星星：${state.stars}</span>
            <span class="pill">🎖️ 最終稱號：${title}</span>
          </div>
          <p><strong>徽章：</strong>${badgeList}</p>
          <p>🌟 重點總結：<strong>生物不是隨便長成那樣，而是為了適應生活環境。</strong></p>
        </section>

        <section class="card">
          <div class="btn-row">
            <button onclick="resetAllProgress()">重新開始遊戲</button>
            <button class="ghost" onclick="goHome()">回首頁</button>
          </div>
        </section>
      `;
    }

    function render() {
      if (state.page === "home") return renderHome();
      if (state.page === "guide") return renderGuide();
      if (state.page === "map") return renderMap();
      if (state.page === "level") return renderLevel();
      if (state.page === "zoneDone") return renderZoneDone();
      return renderFinal();
    }

    // =============================
    // 對外事件函式（給按鈕呼叫）
    // =============================
    function goHome() {
      state.page = "home";
      saveState();
      render();
    }

    function showGuide() {
      state.page = "guide";
      saveState();
      render();
    }

    function startGame() {
      if (state.completedIds.length >= 12) {
        state.page = "final";
      } else if (state.levelIndex > 0 || state.completedIds.length > 0) {
        state.page = "map";
      } else {
        state.page = "map";
      }
      saveState();
      render();
    }

    function resetAllProgress() {
      if (confirm("要重新開始嗎？目前進度會清除。")) {
        resetRun();
      }
    }

    function toggleChoice(choice, multi) {
      toggleSelect(choice, multi);
      saveState();
    }

    function continueAfterBadge() {
      if (state.levelIndex < levelOrder.length - 1) {
        state.levelIndex += 1;
        state.step = 1;
        state.selected = [];
        state.answered = false;
        state.feedback = null;
        state.page = "map";
      } else {
        state.page = "final";
      }
      state.showStarPop = false;
      saveState();
      render();
    }

    function quickPractice() {
      const randomIdx = Math.floor(Math.random() * levelOrder.length);
      state.levelIndex = randomIdx;
      state.step = 1;
      state.selected = [];
      state.answered = false;
      state.feedback = null;
      state.page = "level";
      saveState();
      render();
    }

    render();
  </script>
</body>
</html>
